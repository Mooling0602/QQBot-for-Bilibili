name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      stable:
        description: Build and publish this revision as the stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile sources
        run: uv run python -m compileall -q qqbot

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build wheel
        run: uv build --wheel --out-dir dist

  image-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test-build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish an image
        id: decide
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEAD_COMMIT_MESSAGE" in
            ci:*|ci\(*|docs:*|docs\(*|chore:*|chore\(*)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          git fetch --force --tags
          if git tag --points-at "$GITHUB_SHA" | grep -q .; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    if: needs.image-gate.outputs.publish == 'true'
    needs: image-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out QQBot source
        uses: actions/checkout@v4

      - name: Read locked feed API revision
        id: feed-api
        shell: bash
        run: |
          revision="$(python - <<'PY'
          import tomllib

          with open("uv.lock", "rb") as lock_file:
              packages = tomllib.load(lock_file).get("package", [])
          for package in packages:
              if package.get("name") != "bilibili-feed-api":
                  continue
              source = package.get("source", {}).get("git", "")
              if "#" not in source:
                  raise SystemExit("bilibili-feed-api is not locked to a Git revision")
              print(source.rsplit("#", 1)[1])
              break
          else:
              raise SystemExit("bilibili-feed-api is missing from uv.lock")
          PY
          )"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Check out feed API source
        uses: actions/checkout@v4
        with:
          repository: Mooling0602/bilibili-feed-apis
          ref: ${{ steps.feed-api.outputs.revision }}
          path: bilibili-feed-apis

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build application wheels
        run: |
          uv build --wheel --out-dir dist bilibili-feed-apis
          uv build --wheel --out-dir dist .

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image-tags
        shell: bash
        env:
          IMAGE: ghcr.io/mooling0602/qqbot-for-bilibili
          BUILD_STABLE: ${{ inputs.stable }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags="${IMAGE}:${GITHUB_REF_NAME}"$'\n'"${IMAGE}:stable"$'\n'"${IMAGE}:latest"
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BUILD_STABLE" == "true" ]]; then
            release_tag="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            tags="${IMAGE}:${release_tag}"$'\n'"${IMAGE}:stable"$'\n'"${IMAGE}:latest"
          else
            tags="${IMAGE}:${GITHUB_SHA:0:7}"$'\n'"${IMAGE}:latest"
            release_tag=""
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.qqbot
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            QQBOT_RELEASE_TAG=${{ steps.image-tags.outputs.release_tag }}
