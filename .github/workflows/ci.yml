name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile sources
        run: uv run python -m compileall -q qqbot

      - name: Build wheel
        run: uv build --wheel --out-dir dist

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out QQBot source
        uses: actions/checkout@v4

      - name: Check out feed API source
        uses: actions/checkout@v4
        with:
          repository: Mooling0602/bilibili-feed-apis
          path: bilibili-feed-apis

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build application wheels
        run: |
          uv build --wheel --out-dir dist bilibili-feed-apis
          uv build --wheel --out-dir dist .

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.qqbot
          push: true
          tags: |
            ghcr.io/mooling0602/qqbot-for-bilibili:latest
            ghcr.io/mooling0602/qqbot-for-bilibili:${{ github.sha }}
